          {/* TECHNICAL SKILLS SECTION                                                  */}
          {/* ========================================================================= */}
          <section id="skills" className="relative w-full py-28 px-5 sm:px-8 md:px-12 bg-[#111111] border-t border-white/10">
            <div className="max-w-7xl mx-auto">
              <div className="flex flex-col sm:flex-row sm:items-end justify-between mb-16 border-b border-white/10 pb-6 gap-4">
                <div>
                  <span className="font-mono text-xs text-[#B85D3B] tracking-[0.25em] uppercase block mb-2">
                    06 / Toolkit
                  </span>
                  <h2 className="text-3xl sm:text-5xl font-extrabold uppercase tracking-tight text-white">
                    Software & Capabilities
                  </h2>
                </div>
                <p className="text-xs font-mono text-neutral-400 uppercase tracking-widest max-w-xs">
                  Minimalist architectural skills categorized by discipline.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                {skillCategories.map((group, idx) => (
                  <div key={group.category} className="bg-[#161616] border border-white/10 p-8 flex flex-col justify-between hover:border-white/30 transition-all">
                    <div>
                      <div className="flex items-center justify-between font-mono text-xs text-neutral-500 mb-6 pb-3 border-b border-white/5">
                        <span className="text-[#B85D3B]">CAT-0{idx + 1}</span>
                        <span className="uppercase tracking-widest">Proficient</span>
                      </div>
                      <h3 className="text-xl font-bold uppercase tracking-tight text-white mb-6">
                        {group.category}
                      </h3>
                      <ul className="space-y-3 font-mono text-xs sm:text-sm text-neutral-300">
                        {group.items.map((skill) => (
                          <li key={skill} className="flex justify-between py-2 border-b border-white/5 last:border-0">
                            <span className="text-white font-medium">{skill}</span>
                            <span className="text-[10px] text-neutral-500 uppercase">Active</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ========================================================================= */}
          {/* EDUCATION TIMELINE                                                        */}
          {/* ========================================================================= */}
          <section id="education" className="relative w-full py-28 px-5 sm:px-8 md:px-12 bg-[#0E0E0E] border-t border-white/10">
            <div className="max-w-7xl mx-auto">
              <div className="flex flex-col sm:flex-row sm:items-end justify-between mb-16 border-b border-white/10 pb-6 gap-4">
                <div>
                  <span className="font-mono text-xs text-[#B85D3B] tracking-[0.25em] uppercase block mb-2">
                    07 / Background
                  </span>
                  <h2 className="text-3xl sm:text-5xl font-extrabold uppercase tracking-tight text-white">
                    Education Timeline
                  </h2>
                </div>
              </div>

              <div className="relative border-l border-white/15 ml-4 sm:ml-8 pl-6 sm:pl-12 space-y-12">
                {educationTimeline.map((item, idx) => (
                  <div key={idx} className="relative group">
                    <div className="absolute -left-[31px] sm:-left-[55px] top-1.5 w-3.5 h-3.5 bg-[#121212] border-2 border-white/40 group-hover:border-[#B85D3B] group-hover:bg-[#B85D3B] transition-colors" />
                    <div className="bg-[#141414] border border-white/10 p-6 sm:p-8 hover:border-white/30 transition-colors">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-white/10 pb-4 mb-4">
                        <span className="font-mono text-xs text-[#B85D3B] uppercase tracking-[0.2em]">{item.period}</span>
                        {item.status && (
                          <span className="font-mono text-[11px] px-2.5 py-0.5 bg-white/5 border border-white/10 text-neutral-300 w-max">
                            {item.status}
                          </span>
                        )}
                      </div>
                      <h3 className="text-xl sm:text-2xl font-bold uppercase tracking-tight text-white mb-2">{item.degree}</h3>
                      <p className="text-base text-neutral-200 font-medium mb-1">{item.institution}</p>
                      <p className="font-mono text-xs text-neutral-400 uppercase tracking-wider mb-4">{item.location}</p>
                      {item.notes && <p className="text-xs sm:text-sm text-neutral-400 font-light">{item.notes}</p>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ========================================================================= */}
          {/* CONTACT SECTION                                                           */}
          {/* ========================================================================= */}
          <section id="contact" className="relative w-full py-28 px-5 sm:px-8 md:px-12 bg-[#0B0B0B] border-t border-white/10">
            <div className="max-w-7xl mx-auto">
              <div className="max-w-3xl mb-16">
                <span className="font-mono text-xs text-[#B85D3B] tracking-[0.25em] uppercase block mb-3">08 / Contact</span>
                <h2 className="text-4xl sm:text-6xl md:text-7xl font-black uppercase tracking-tight text-white mb-6">
                  Let's Connect
                </h2>
                <p className="text-lg sm:text-xl text-neutral-300 font-light leading-relaxed">
                  Interested in architecture, collaboration or internship opportunities? Let's connect.
                </p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16 items-start">
                <div className="lg:col-span-5 space-y-10">
                  <div className="bg-[#141414] border border-white/10 p-8 space-y-6">
                    <div>
                      <span className="block font-mono text-[11px] uppercase tracking-[0.25em] text-neutral-400 mb-1">Primary Email</span>
                      <a href={`mailto:${personalInfo.email}`} className="text-lg sm:text-xl font-mono text-white hover:text-[#B85D3B] transition-colors break-all">
                        {personalInfo.email}
                      </a>
                    </div>
                    <div>
                      <span className="block font-mono text-[11px] uppercase tracking-[0.25em] text-neutral-400 mb-1">Location</span>
                      <span className="text-base text-white font-medium">{personalInfo.location}</span>
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row gap-4">
                    <a
                      href={`mailto:${personalInfo.email}`}
                      className="px-8 py-4 bg-white text-black font-semibold text-xs uppercase tracking-[0.2em] hover:bg-[#B85D3B] hover:text-white transition-all text-center"
                    >
                      Email Me →
                    </a>
                    <button
                      onClick={() => setIsCVOpen(true)}
                      className="px-8 py-4 border border-white/30 text-white font-medium text-xs uppercase tracking-[0.2em] hover:border-white hover:bg-white/5 transition-all text-center cursor-pointer"
                    >
                      Download CV ↓
                    </button>
                  </div>
                </div>

                <div className="lg:col-span-7 bg-[#141414] border border-white/10 p-8 sm:p-10">
                  <h3 className="text-xl font-bold uppercase tracking-tight text-white mb-6 pb-3 border-b border-white/10">
                    Send a Direct Inquiry
                  </h3>
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      window.location.href = `mailto:${personalInfo.email}?subject=Architectural%20Inquiry`;
                    }}
                    className="space-y-6 text-xs font-mono"
                  >
                    <div>
                      <label className="block uppercase tracking-widest text-neutral-400 mb-2">Your Name</label>
                      <input type="text" required placeholder="e.g. Ar. Rajesh Mehta" className="w-full px-4 py-3 bg-black border border-white/20 text-white focus:outline-none focus:border-[#B85D3B]" />
                    </div>
                    <div>
                      <label className="block uppercase tracking-widest text-neutral-400 mb-2">Your Email</label>
                      <input type="email" required placeholder="studio@domain.com" className="w-full px-4 py-3 bg-black border border-white/20 text-white focus:outline-none focus:border-[#B85D3B]" />
                    </div>
                    <div>
                      <label className="block uppercase tracking-widest text-neutral-400 mb-2">Message</label>
                      <textarea required rows={4} placeholder="Inquiry regarding architectural internships, collaboration, or design work..." className="w-full px-4 py-3 bg-black border border-white/20 text-white focus:outline-none focus:border-[#B85D3B] resize-none" />
                    </div>
                    <button type="submit" className="w-full py-4 bg-white text-black font-bold uppercase tracking-[0.2em] hover:bg-[#B85D3B] hover:text-white transition-colors cursor-pointer">
                      Send Email
                    </button>
                  </form>
                </div>
              </div>

              <div className="mt-24 pt-8 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-4 font-mono text-xs text-neutral-500">
                <span>© {new Date().getFullYear()} Abhijit Gholap. All rights reserved.</span>
                <span>B.Arch Portfolio • Navi Mumbai, India</span>
              </div>
            </div>
          </section>

          {/* ========================================================================= */}
          {/* PROJECT CASE STUDY MODAL                                                  */}
          {/* ========================================================================= */}
          {selectedProject && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/95 backdrop-blur-xl flex flex-col justify-start">
              <div className="sticky top-0 z-50 bg-[#101010]/95 backdrop-blur-md border-b border-white/10 px-6 py-4 flex items-center justify-between">
                <div className="flex items-center space-x-4">
                  <span className="font-mono text-sm text-[#B85D3B] font-bold">{selectedProject.number}</span>
                  <span className="hidden sm:inline text-neutral-500">/</span>
                  <h2 className="text-base sm:text-lg font-bold uppercase text-white truncate max-w-xs sm:max-w-md">
                    {selectedProject.name}
                  </h2>
                </div>
                <button
                  onClick={() => setSelectedProject(null)}
                  className="p-2 border border-white/30 text-white hover:bg-[#B85D3B] hover:border-[#B85D3B] transition-colors cursor-pointer"
                >
                  ✕ Close
                </button>
              </div>

              <div className="max-w-6xl w-full mx-auto px-5 sm:px-8 py-10">
                <div className="relative aspect-[16/9] w-full overflow-hidden bg-neutral-900 border border-white/10 mb-10">
                  <img src={selectedProject.coverImage} alt={selectedProject.name} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent" />
                  <div className="absolute bottom-6 left-6 right-6 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                    <div>
                      <span className="font-mono text-xs text-[#B85D3B] uppercase tracking-[0.25em] block mb-1">
                        {selectedProject.category}
                      </span>
                      <h1 className="text-3xl sm:text-5xl font-black uppercase text-white">
                        {selectedProject.name}
                      </h1>
                    </div>
                    <div className="font-mono text-xs text-neutral-300 bg-black/80 px-4 py-2 border border-white/15">
                      {selectedProject.location} • {selectedProject.area}
                    </div>
                  </div>
                </div>

                {/* Tabs */}
                <div className="flex flex-wrap gap-2 border-b border-white/10 pb-4 mb-10 text-xs font-mono uppercase tracking-[0.2em]">
                  {['overview', 'process', 'drawings', 'sustainability', 'renders'].map((tab) => (
                    <button
                      key={tab}
                      onClick={() => setCaseStudyTab(tab)}
                      className={`px-4 py-2 border cursor-pointer ${
                        caseStudyTab === tab
                          ? 'border-[#B85D3B] text-white bg-[#B85D3B]/20 font-bold'
                          : 'border-white/10 text-neutral-400 hover:text-white'
                      }`}
                    >
                      {tab}
                    </button>
                  ))}
                </div>

                {/* Tab Content */}
                {caseStudyTab === 'overview' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div className="bg-[#141414] border border-white/10 p-8">
                      <span className="font-mono text-xs text-[#B85D3B] uppercase block mb-2">Design Concept</span>
                      <p className="text-lg text-neutral-200 font-light leading-relaxed mb-6">{selectedProject.concept}</p>
                      <p className="text-sm text-neutral-400 leading-relaxed">{selectedProject.description}</p>
                    </div>
                  </div>
                )}

                {caseStudyTab === 'process' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div className="bg-[#141414] border border-white/10 p-8">
                      <h4 className="text-xl font-bold uppercase text-white mb-4">Site Analysis</h4>
                      <ul className="space-y-3">
                        {selectedProject.siteAnalysis.map((s, i) => (
                          <li key={i} className="text-sm text-neutral-300 pl-3 border-l border-[#B85D3B]">{s}</li>
                        ))}
                      </ul>
                    </div>
                  </div>
                )}

                {caseStudyTab === 'drawings' && (
                  <div className="space-y-8 animate-fadeIn">
                    {selectedProject.plans.map((p, i) => (
                      <div key={i} className="bg-[#141414] border border-white/10 p-6">
                        <div className="flex justify-between items-center mb-4">
                          <h4 className="text-lg font-bold uppercase text-white">{p.title}</h4>
                          <span className="font-mono text-xs text-[#B85D3B]">{p.type}</span>
                        </div>
                        <p className="text-sm text-neutral-300 mb-4">{p.desc}</p>
                        <div className="aspect-[21/9] bg-black border border-dashed border-white/20 flex items-center justify-center font-mono text-xs text-neutral-500">
                          [Technical Sheet: {p.title}]
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {caseStudyTab === 'sustainability' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div className="bg-[#141414] border border-white/10 p-8">
                      <h4 className="text-xl font-bold uppercase text-white mb-4">Sustainability & Climate Response</h4>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {selectedProject.sustainabilityStrategy.map((strat, i) => (
                          <div key={i} className="p-4 bg-white/5 border border-white/5">
                            <span className="font-mono text-xs text-[#B85D3B] block mb-1">Strategy 0{i + 1}</span>
                            <p className="text-sm text-neutral-300 font-light">{strat}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {caseStudyTab === 'renders' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                      {selectedProject.views3D.map((v, i) => (
                        <div key={i} className="bg-[#141414] border border-white/10 overflow-hidden">
                          <div className="aspect-[16/10] bg-neutral-900">
                            <img src={selectedProject.coverImage} alt={v.title} className="w-full h-full object-cover" />
                          </div>
                          <div className="p-6">
                            <h5 className="text-base font-bold uppercase text-white mb-2">{v.title}</h5>
                            <p className="text-xs text-neutral-400">{v.desc}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* CV MODAL                                                                  */}
          {/* ========================================================================= */}
          {isCVOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/90 backdrop-blur-md flex items-center justify-center p-4 sm:p-6">
              <div className="bg-[#121212] border border-white/20 max-w-4xl w-full max-h-[90vh] overflow-y-auto flex flex-col justify-between shadow-2xl">
                <div className="sticky top-0 z-20 bg-[#161616] border-b border-white/10 px-6 py-4 flex items-center justify-between">
                  <span className="font-mono text-xs text-[#B85D3B] font-bold">ABHIJIT GHOLAP — CURRICULUM VITAE</span>
                  <div className="flex items-center space-x-3">
                    <button onClick={() => window.print()} className="px-3 py-1.5 border border-white/20 text-white font-mono text-xs uppercase hover:bg-white hover:text-black">
                      Print / PDF
                    </button>
                    <button onClick={() => setIsCVOpen(false)} className="p-1.5 border border-white/20 text-white hover:bg-[#B85D3B]">
                      ✕
                    </button>
                  </div>
                </div>

                <div className="p-8 sm:p-12 space-y-8 text-neutral-300">
                  <div className="border-b border-white/15 pb-6 flex flex-col sm:flex-row justify-between sm:items-end gap-4">
                    <div>
                      <h1 className="text-3xl font-extrabold uppercase text-white">{personalInfo.name}</h1>
                      <p className="font-mono text-xs uppercase text-[#B85D3B]">{personalInfo.title} • {personalInfo.degree}</p>
                    </div>
                    <div className="font-mono text-xs text-neutral-400 sm:text-right">
                      <p>{personalInfo.location}</p>
                      <p>{personalInfo.phone}</p>
                      <p className="text-white font-semibold">{personalInfo.email}</p>
                    </div>
                  </div>

                  <div>
                    <h2 className="font-mono text-xs uppercase text-[#B85D3B] border-b border-white/10 pb-2 mb-3">Education</h2>
                    {educationTimeline.map((edu, i) => (
                      <div key={i} className="mb-3 text-xs">
                        <span className="font-bold text-white text-sm block">{edu.degree}</span>
                        <span className="text-neutral-300">{edu.institution} ({edu.location}) — {edu.period}</span>
                      </div>
                    ))}
                  </div>

                  <div>
                    <h2 className="font-mono text-xs uppercase text-[#B85D3B] border-b border-white/10 pb-2 mb-3">Academic Projects (Sem I–VII)</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                      {academicProjects.map((p) => (
                        <div key={p.id} className="p-2.5 bg-white/5 border border-white/5">
                          <span className="font-mono text-[10px] text-[#B85D3B]">{p.number} • {p.semester}</span>
                          <p className="font-bold text-white">{p.name}</p>
                          <p className="text-neutral-400 text-[11px]">{p.location} • {p.area}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <h2 className="font-mono text-xs uppercase text-[#B85D3B] border-b border-white/10 pb-2 mb-3">Professional Experience</h2>
                    <div className="text-xs">
                      <p className="font-bold text-white text-sm">Sports Complex — Goa</p>
                      <p className="text-[#B85D3B] font-mono">Mayur Naik & Associates (Principal: Ar. Mayur Naik)</p>
                      <p className="text-neutral-400 mt-1">Role: Architectural Design Assistance</p>
                    </div>
                  </div>

                  <div>
                    <h2 className="font-mono text-xs uppercase text-[#B85D3B] border-b border-white/10 pb-2 mb-3">Software Skills</h2>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs font-mono">
                      {skillCategories.map((c, i) => (
                        <div key={i}>
                          <span className="text-neutral-500 uppercase block">{c.category}</span>
                          <span className="text-white">{c.items.join(', ')}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="bg-[#161616] border-t border-white/10 p-4 flex justify-end">
                  <button onClick={() => setIsCVOpen(false)} className="px-6 py-2 bg-white text-black font-mono text-xs uppercase font-bold hover:bg-[#B85D3B] hover:text-white">
                    Close CV
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* SHEET INSPECTOR MODAL                                                     */}
          {/* ========================================================================= */}
          {selectedSheet && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#141414] border border-white/20 max-w-2xl w-full p-8 relative">
                <div className="flex items-center justify-between border-b border-white/10 pb-4 mb-6">
                  <div>
                    <span className="font-mono text-xs text-[#B85D3B] uppercase">{selectedSheet.sheetNumber} • Scale {selectedSheet.scale}</span>
                    <h3 className="text-2xl font-bold uppercase text-white mt-1">{selectedSheet.title}</h3>
                  </div>
                  <button onClick={() => setSelectedSheet(null)} className="p-2 border border-white/20 text-white">✕</button>
                </div>
                <p className="text-sm text-neutral-300 leading-relaxed mb-6">{selectedSheet.description}</p>
                <div className="aspect-[16/10] bg-black border border-white/10 flex flex-col items-center justify-center p-6 text-center font-mono text-xs text-neutral-400">
                  <span className="text-white text-base font-bold mb-2">{selectedSheet.title} Sheet</span>
                  <span>Drafted in AutoCAD with NBC specifications and dimensional callouts.</span>
                </div>
                <div className="mt-6 pt-4 border-t border-white/10 flex justify-end">
                  <button onClick={() => setSelectedSheet(null)} className="px-6 py-2 bg-white text-black font-mono text-xs uppercase font-bold hover:bg-[#B85D3B] hover:text-white">
                    Close Sheet
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
